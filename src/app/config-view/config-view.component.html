
<div *ngFor="let section of configSections">
  <h3>{{ section.label }}</h3>
  <div *ngIf="section.name === 'timePeriodOptions'">
    <div *ngFor="let option of section.options">
      <label>
        <input type="radio" name="timePeriod" [value]="option.value" [(ngModel)]="selectedConfig.timePeriod">
        {{ option.label }}
      </label>
    </div>
  </div>
  <div *ngIf="section.name !== 'timePeriodOptions'">
    <div *ngFor="let option of section.options">
      <label>
        <input type="checkbox" [value]="option.value" [(ngModel)]="checkboxState[option.value].checked">
        {{ option.label }}
      </label>
    </div>
  </div>
</div>
<button (click)="onSubmit()">Submit</button>
<button (click)="resetAllSettings()">Reset</button>
